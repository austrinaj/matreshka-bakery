{% extends "admin_base.html" %}
{% block content %}
<h2>Меню</h2>
<form method="post" class="inline-form">
    <input name="name" placeholder="Название" required>
    <input name="weight" placeholder="Вес (150 г)">
    <input name="price" placeholder="Цена" required>
    <button class="button" type="submit">Добавить</button>
</form>

<div class="table-wrap">
<table>
    <tr><th>№</th><th>Название</th><th>Вес</th><th>Цена</th><th>На сайте</th></tr>
    {% for p in products %}
    <tr class="{{ '' if p.active else 'disabled' }}">
        <td>{{ p.id }}</td>
        <td>{{ p.name }}</td>
        <td>{{ p.weight }}</td>
        <td>{{ p.price }} ₽</td>
        <td>
            <form method="post" action="{{ url_for('toggle_product', product_id=p.id) }}">
                <button type="submit">{{ 'Скрыть' if p.active else 'Показать' }}</button>
            </form>
        </td>
    </tr>
    {% endfor %}
</table>
</div>
{% endblock %}
